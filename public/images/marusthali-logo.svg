<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Radial Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="1" />
      <stop offset="60%" stop-color="#FDE68A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FAF5EC" stop-opacity="0" />
    </radialGradient>

    <!-- Ceramic Barni Glaze Gradient -->
    <linearGradient id="amberGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Ceramic Body Gradient -->
    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#EADBCC" />
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Curved Paths for Arched Text -->
    <path id="topTextArc" d="M 40,150 A 110,110 0 0,1 260,150" fill="none" />
    <path id="bottomTextArc" d="M 260,150 A 110,110 0 0,1 40,150" fill="none" />
  </defs>

  <!-- Outer Beaded Circle Frame -->
  <circle cx="150" cy="150" r="144" fill="#FFFFFF" stroke="#B45309" stroke-width="3.5" />
  <circle cx="150" cy="150" r="137" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="150" cy="150" r="132" fill="#FAF5EC" stroke="#B45309" stroke-width="1.5" />

  <!-- Inner Seal Background -->
  <circle cx="150" cy="150" r="98" fill="url(#sunGlow)" stroke="#C88214" stroke-width="1.5" />

  <!-- Radiating Sun Rays (Dhoop Sun-Cured Heritage) -->
  <g stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="150" y1="62" x2="150" y2="74" />
    <line x1="185" y1="72" x2="178" y2="83" />
    <line x1="214" y1="98" x2="203" y2="105" />
    <line x1="228" y1="134" x2="216" y2="136" />
    <line x1="115" y1="72" x2="122" y2="83" />
    <line x1="86" y1="98" x2="97" y2="105" />
    <line x1="72" y1="134" x2="84" y2="136" />
  </g>

  <!-- Sun Disc -->
  <circle cx="150" cy="120" r="30" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.5" opacity="0.85" />

  <!-- ============================================== -->
  <!-- THE ICONIC RAJASTHANI CERAMIC BARNI (MARTABAN) -->
  <!-- ============================================== -->
  <g transform="translate(150, 158) scale(0.92)">
    
    <!-- Shadow under Barni -->
    <ellipse cx="0" cy="56" rx="46" ry="7" fill="#29150B" opacity="0.18" />

    <!-- Ceramic Jar Body (White glazed earthenware) -->
    <path d="M -38,10 
             C -42,24 -40,48 -32,54 
             C -24,58 24,58 32,54 
             C 40,48 42,24 38,10 
             Z" 
          fill="url(#ceramicBody)" 
          stroke="#5C2D0C" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Traditional Amber/Mustard Glazed Shoulder & Rim -->
    <path d="M -38,10 
             C -38,4 -32,-8 -24,-12 
             L 24,-12 
             C 32,-8 38,4 38,10 
             C 30,14 -30,14 -38,10 
             Z" 
          fill="url(#amberGlaze)" 
          stroke="#5C2D0C" 
          stroke-width="2.5" />

    <!-- Jar Neck Ring -->
    <rect x="-24" y="-18" width="48" height="7" rx="2" fill="#92400E" stroke="#5C2D0C" stroke-width="2" />

    <!-- Tied Muslin Cloth Cap (Cotton Potli tied on top) -->
    <path d="M -26,-18 
             C -28,-26 -16,-34 0,-34 
             C 16,-34 28,-26 26,-18 
             Z" 
          fill="#FFFDF9" 
          stroke="#5C2D0C" 
          stroke-width="2" />

    <!-- Tied Golden String (Dhaga) -->
    <path d="M -28,-18 Q 0,-14 28,-18" stroke="#D97706" stroke-width="2.2" fill="none" />
    <circle cx="0" cy="-16" r="3" fill="#D97706" stroke="#78350F" stroke-width="1" />
    
    <!-- String Knot Tails -->
    <path d="M -1,-15 Q -5,-8 -9,-4" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 1,-15 Q 5,-7 8,-3" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Authentic Paisley / Marusthali Motif on Jar Belly -->
    <g transform="translate(0, 32)">
      <!-- Royal Heritage Motif -->
      <path d="M 0,-14 C 6,-14 10,-8 10,0 C 10,8 0,14 0,14 C 0,14 -10,8 -10,0 C -10,-8 -6,-14 0,-14 Z" 
            fill="#B45309" opacity="0.85" />
      <circle cx="0" cy="-1" r="3.5" fill="#FFFDF9" />
      <circle cx="0" cy="-1" r="1.5" fill="#78350F" />
      <!-- Star dot above -->
      <circle cx="0" cy="-18" r="1.5" fill="#B45309" />
    </g>

    <!-- Green Mango Leaf sprig framing left side -->
    <g transform="translate(-32, 28) rotate(-35)">
      <path d="M 0,0 C -8,-14 4,-26 12,-30 C 14,-18 10,-6 0,0 Z" fill="#15803D" stroke="#166534" stroke-width="1" />
      <path d="M 0,0 Q 6,-15 12,-30" stroke="#86EFAC" stroke-width="0.8" fill="none" />
    </g>

    <!-- Golden Mustard Flower sprig on right side -->
    <g transform="translate(32, 34) rotate(25)">
      <circle cx="6" cy="-14" r="3" fill="#EAB308" stroke="#A16207" stroke-width="0.8" />
      <circle cx="12" cy="-18" r="2.5" fill="#FACC15" stroke="#A16207" stroke-width="0.8" />
      <circle cx="10" cy="-8" r="2.5" fill="#FDE047" stroke="#A16207" stroke-width="0.8" />
      <path d="M 0,0 Q 6,-10 10,-18" stroke="#15803D" stroke-width="1.2" fill="none" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- BRAND TYPOGRAPHY ALONG CIRCULAR EMBLEM ARCS   -->
  <!-- ============================================== -->

  <!-- Top Arched Text: MARUSTHALI ACHAR -->
  <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-weight="900" 
        font-size="18.5" 
        fill="#1F110B" 
        letter-spacing="4">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      MARUSTHALI ACHAR
    </textPath>
  </text>

  <!-- Star Embellishments on Left and Right of Midpoint -->
  <g fill="#D97706">
    <polygon points="34,150 36,145 41,144 37,141 38,136 34,139 30,136 31,141 27,144 32,145" />
    <polygon points="266,150 268,145 273,144 269,141 270,136 266,139 262,136 263,141 259,144 264,145" />
  </g>

  <!-- Bottom Arched Text: DESI SWAD • EST. 1994 • SIKAR -->
  <text font-family="'Montserrat', 'Inter', sans-serif" 
        font-weight="800" 
        font-size="10" 
        fill="#78350F" 
        letter-spacing="2.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      • DESI SWAD • EST. 1994 • SIKAR •
    </textPath>
  </text>
</svg>
